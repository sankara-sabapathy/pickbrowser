name: macOS
on:
  push:
    branches-ignore: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: |
          python3 scripts/test-release.py
          python3 scripts/check-site.py
          bash scripts/test.sh
      - name: Universal application
        run: bash scripts/build-app.sh --universal
      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/PickBrowser.app dist/PickBrowser-macOS.zip
          bash scripts/build-dmg.sh dist/PickBrowser.app dist/PickBrowser.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: PickBrowser-macOS
          path: |
            dist/PickBrowser.dmg
            dist/PickBrowser-macOS.zip
          if-no-files-found: error
